services:
  backend:
    build:
      context: ./backend
    container_name: doomsday-ready-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: doomsday-ready-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
